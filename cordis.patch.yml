# Патч-слой пакета dsh-memory — точка монтирования плагина в профиль.
#
# `dsh plugin --profile <имя> add <путь>` видит `dsh.bundle.patch` в
# package.json, дописывает `@vkozachek/dsh-memory` в `dsh.profile.bundles` профиля и
# применяет этот файл отдельным слоем после dsh-base и dsh-web-app. Поэтому
# руками править `~/.dsh/profiles/<имя>/cordis.patch.yml` не нужно: ряд ниже и
# есть монтирование.
#
# Ряд — обычная Loader-энтри: cordis импортирует пакет `@vkozachek/dsh-memory` (ESM-точка
# входа `lib/index.js`) и вызывает `apply(ctx, config)`. Плагин не требует
# сервисов, поэтому грузится и в профиле без инструментов.
#
# Конфиг — блок `dsh-memory` из README (namespace, db_path, inject, search,
# index, embeddings, verify): схема, дефолты и разбор `DSH_MEMORY_*` живут в
# `lib/config.js`. Здесь ряд намеренно без `config`, чтобы дефолты не
# дублировались: настройки переопределяются либо полями ряда, либо окружением.
- insert:
    - id: dsh-memory
      name: '@vkozachek/dsh-memory'

